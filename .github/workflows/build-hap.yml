name: Build Debug HAP (unsigned, setup-ohos)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ErBWs/setup-ohos@v2 自动下载+缓存 HarmonyOS CLI tools（含 SDK/hvigorw/ohpm）
      # 5.0.13.200 = API 14 / 5.0.2(14)，与工程 compatibleSdkVersion 匹配
      - name: Setup HarmonyOS CLI tools (API 14 / 5.0.2)
        uses: ErBWs/setup-ohos@v2
        with:
          version: 5.0.13.200
          cache: true

      # 工程 signingConfigs 指向本机 DevEco 签名文件（绝对路径+密文），CI 不可用，剥离后产 unsigned HAP
      - name: Strip local signing config
        run: |
          python3 - <<'EOF'
          import re
          p = 'build-profile.json5'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'"signingConfigs"\s*:\s*\[.*?\],', '"signingConfigs": [],', s, flags=re.S)
          s = re.sub(r'\s*"signingConfig"\s*:\s*"[^"]*",?', '', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('signingConfigs stripped')
          EOF

      # OpenHarmony 开源 SDK 不含 @ohos.jsvm（HarmonyOS NEXT 商业 API），
      # 工程内已内置 jsvmStub.ets 类型占位，CI 可编译出 unsigned HAP；
      # 书源 JS 规则需在本机 DevEco Studio 完整 SDK 环境下构建使用。
      - name: Show jsvm stub note
        run: |
          echo "jsvm stubbed in CI build (see entry/src/main/ets/common/model/jsEngine/jsvmStub.ets)"
          echo "SDK root: $HOS_SDK_HOME"
          cat "$HOS_SDK_HOME/../hvigor/hvigor/package.json" 2>/dev/null | grep '"version"' | head -1 || true

      - name: ohpm install
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          export PATH="$HOS_SDK_HOME/../bin:$PATH"
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Build debug HAP (unsigned)
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          export PATH="$HOS_SDK_HOME/../bin:$PATH"
          hvigorw --no-daemon assembleHap --mode module -p product=default -p buildMode=debug

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-hap
          path: |
            entry/build/**/outputs/**/*.hap
            commons/**/build/**/outputs/**/*.hap
            readerLibrary/**/build/**/outputs/**/*.hap
          if-no-files-found: error
