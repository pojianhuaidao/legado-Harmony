name: Build Debug HAP (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 华为官方 Command Line Tools 26.0.0.851（内含 HarmonyOS SDK 26 + hvigor 6.26.8 + ohpm + node）
      # 直链从华为开发者下载中心获取，签名参数有效期约 10 年，无需登录。
      - name: Download HarmonyOS Command Line Tools
        run: |
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' -o /tmp/clt.zip \
            "https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/de/v3/kICkkkAeThGTxoJ0yD55vA/commandline-tools-linux-x64-26.0.0.851.zip?HW-CC-KV=V1&HW-CC-Date=20260928T072229Z&HW-CC-Expire=315360000&HW-CC-Sign=9F0371E2E668EC958BA13AD6A7CC92BD194360AF545FFE6070A12FE905B027A1"
          mkdir -p "$HOME/clt"
          unzip -q /tmp/clt.zip -d "$HOME/clt"
          ls "$HOME/clt/command-line-tools"
          cat "$HOME/clt/command-line-tools/version.txt"

      # 工程 hvigorfile.ts 通过 '@ohos/hvigor-ohos-plugin' 解析构建插件，
      # 将工具链内置插件软链到工程 node_modules，保证 hvigor 6.26.8 可直接加载。
      - name: Link hvigor plugins to project
        run: |
          mkdir -p node_modules/@ohos
          ln -sfn "$HOME/clt/command-line-tools/hvigor/hvigor" node_modules/@ohos/hvigor
          ln -sfn "$HOME/clt/command-line-tools/hvigor/hvigor-ohos-plugin" node_modules/@ohos/hvigor-ohos-plugin

      # 工程 signingConfigs 指向本机签名文件（legado.p12 等），CI 无此文件，
      # 构建前移除签名配置，产出 unsigned HAP，可直接侧载。
      - name: Strip local signing config
        run: |
          python3 - <<'EOF'
          import json, re
          p = 'build-profile.json5'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'"signingConfigs"\s*:\s*\[.*?\],', '"signingConfigs": [],', s, flags=re.S)
          s = re.sub(r'\s*"signingConfig"\s*:\s*"[^"]*",?', '', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('signingConfigs stripped')
          EOF

      - name: ohpm install
        run: |
          export DEVECO_SDK_HOME="$HOME/clt/command-line-tools/sdk"
          export PATH="$HOME/clt/command-line-tools/bin:$PATH"
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Build debug HAP (unsigned)
        run: |
          export DEVECO_SDK_HOME="$HOME/clt/command-line-tools/sdk"
          export PATH="$HOME/clt/command-line-tools/bin:$PATH"
          hvigorw --no-daemon assembleHap --mode module -p product=default -p buildMode=debug

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-hap
          path: |
            entry/build/**/outputs/**/*.hap
            commons/**/build/**/outputs/**/*.hap
            readerLibrary/**/build/**/outputs/**/*.hap
          if-no-files-found: error
